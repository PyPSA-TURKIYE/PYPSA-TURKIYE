  min_expansion: 1
  min_DC_length: 600
cluster_options:
  simplify_network:
    to_substations: false
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
    remove_stubs: true
    remove_stubs_across_borders: false
    # --- izole bileşen (OSM hat boşluğu) düzeltmesi, 2026-06-12 ---
    # Türkiye'de elektriksel ada yok; base.nc'deki 29 kopuk bileşen (11 adet
    # 154 kV "cep": Mersin, Fethiye, Alanya, Çeşme, Aliağa, Kayseri, Kırıkkale,
    # Bolu, Rize x2 vb.) OSM veri boşluğudur. Eski ayar (drop=20, merge=300,
    # fetch=false) 1.24 TWh talebi ÇÖPE atıyor + 5.16-7.76 TWh talebi üretimsiz
    # kurgusal izole "TR1 0" bus'ına hapsediyordu (validation2023'te %100 load
    # shedding; 2018 kapasite genişlemesinde hayalet ada yatırımı).
    # Yeni ayar: drop/merge kapalı, fetch açık -> her cep en yakın omurga
    # bus'ına sjoin_nearest ile bağlanır, talep TAM korunur (test: 319.08 TWh,
    # tek bağlı bileşen). Anahtarlar upstream PyPSA-Earth standardıdır
    # (scripts/simplify_network.py: drop/merge_isolated_networks, merge_into_network).
    p_threshold_drop_isolated: false
    p_threshold_merge_isolated: false
    s_threshold_fetch_isolated: 0.05
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: false
  distribute_cluster:
  - load
  out_logging: true
  aggregation_strategies:
    generators:
      p_nom: sum
      p_nom_max: sum
      p_nom_min: sum
      p_min_pu: mean
      p_max_pu: capacity_weighted_average
      build_year: first  # FIX: clustering'de capacity_weighted_average build_year'ı bozuyordu (1010 anomali); tüm değerler 2020 → first temiz
      lifetime: first    # FIX: aynı; myopic'e dönülürse kritik, overnight'ta zararsız  # BUG FIX 2026-06-12: weighted_average, weight=1.0 olan mevcut santrallerde AĞIRLIKSIZ ortalamaya düşüyordu (onwind filo CF %11.76→%8.74 eziliyordu). capacity_weighted_average p_nom ile ağırlıklar.
      marginal_cost: mean
      committable: any
      ramp_limit_up: max
      ramp_limit_down: max
      efficiency: mean
  focus_weights: false
